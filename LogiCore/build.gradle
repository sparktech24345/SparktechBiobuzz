plugins {
    id 'com.android.library'
    id 'maven-publish'
}

android {
    namespace 'ro.sparktech24345.logicore'
    //noinspection GradleDependency
    compileSdk 34

    defaultConfig {
        minSdk 24
        //noinspection ExpiredTargetSdkVersion
        targetSdk 28
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    // Removed resolutionStrategy to avoid polluting the root project

    publishing {
        singleVariant("release") {
            withSourcesJar()
        }
    }
}

dependencies {
    //noinspection Aligned16KB
    compileOnly 'org.firstinspires.ftc:RobotCore:12.0.0'
    compileOnly 'org.firstinspires.ftc:Hardware:12.0.0'
    compileOnly 'org.firstinspires.ftc:FtcCommon:12.0.0'
    compileOnly 'org.firstinspires.ftc:Vision:12.0.0'

    implementation 'dev.frozenmilk.dairy:CachingHardware:1.0.0'
    compileOnly 'org.solverslib:photon:0.3.5'

    // Blaze FTC
    compileOnly 'dev.anygeneric:blazeftc:0.1.63'
    compileOnly 'dev.anygeneric:blazeftc_pedro3:0.1.63'

    compileOnly 'com.pedropathing:revhub:3.0.1'
    compileOnly 'com.pedropathing:tuning:1.0.1'
    compileOnly 'dev.frozenmilk.sinister:Sloth:0.3.2'
    compileOnly 'com.acmerobotics.slothboard:dashboard:0.3.2+0.6.0'
}


afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release

                groupId = 'com.github.andrei-147'
                artifactId = 'LogiCore'
                version = project.version 
            }
        }
    }
}
